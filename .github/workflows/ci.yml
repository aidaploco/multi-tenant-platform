name: ci

# Pre-merge code checks — no cloud credentials needed, so this runs on every PR (unlike the
# credential-gated CD). The "pytest + pylint" for our Terraform: format, validate, the mocked
# `terraform test` suites, the OPA policy unit tests, tflint, a Trivy misconfiguration scan,
# workflow linting and a secret scan.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# One run per PR at a time: a new push cancels the superseded run instead of burning minutes on
# it. Pushes to main are never cancelled, so every merge keeps its own complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Secret scan over the full git history, before anything else runs. Pinned release + checksum
  # (no third-party action). Fails the build on any finding; findings are redacted in the log.
  #
  # The config (.gitleaks.toml) and fingerprint ignores (.gitleaksignore) are taken from `main`,
  # NOT from the PR: gitleaks reads both from the scanned tree, so otherwise a PR could allowlist
  # its own leak in the same commit that introduces it. If main has neither file, the scan runs
  # with the built-in rules only (stricter, never looser) — it never falls back to the PR's copy.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: checkout the trusted gitleaks config from main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          path: trusted-main
          persist-credentials: false
      - name: replace the PR's gitleaks config with main's
        run: |
          set -euo pipefail
          for f in .gitleaks.toml .gitleaksignore; do
            rm -f "$f"
            if [ -f "trusted-main/$f" ]; then cp "trusted-main/$f" "$f"; fi
          done
          rm -rf trusted-main
      - name: gitleaks (full history)
        run: |
          set -euo pipefail
          ver=8.30.1
          sha=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz"
          echo "${sha}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --log-opts="--all" .

  # A workflow that fails to PARSE produces a run with no jobs, hence no check runs: its required
  # checks are absent rather than red, and a PR can read as green while CI is dead. actionlint
  # fails loudly on that (and on bad expressions and shell).
  actionlint:
    needs: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          set -euo pipefail
          ver=1.7.12
          sha=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v${ver}/actionlint_${ver}_linux_amd64.tar.gz"
          echo "${sha}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  fmt:
    needs: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.15.7"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive

  test:
    needs: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.15.7"
          terraform_wrapper: false
      # Providers: no module commits a .terraform.lock.hcl (consumers own the lock), so every `init`
      # would re-download the ~100 MB google provider (10 modules = 10 downloads, each a chance to
      # stall). A plugin cache alone does not help without a lock file to check the cached copy
      # against, so the cache is paired with MAY_BREAK_DEPENDENCY_LOCK_FILE; that only loosens the
      # throwaway lock files this job writes.
      # Each init gets a timeout and 3 attempts; a timeout may leave a half-extracted cache entry,
      # so that case wipes the cache before retrying.
      - name: validate + test every module
        env:
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/tf-plugin-cache
          TF_PLUGIN_CACHE_MAY_BREAK_DEPENDENCY_LOCK_FILE: "true"
        run: |
          set -euo pipefail
          mkdir -p "$TF_PLUGIN_CACHE_DIR"

          init_module() {
            local attempt rc
            for attempt in 1 2 3; do
              rc=0
              timeout -k 15 180 terraform -chdir="$1" init -backend=false -input=false || rc=$?
              if [ "$rc" -eq 0 ]; then return 0; fi
              echo "::warning::terraform init in $1 failed (rc=$rc, attempt $attempt/3)"
              if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
                rm -rf "$TF_PLUGIN_CACHE_DIR" "$1/.terraform"
                mkdir -p "$TF_PLUGIN_CACHE_DIR"
              fi
            done
            return 1
          }

          dirs=$(find modules -name '*.tftest.hcl' | sed -E 's#/tests/.*##' | sort -u)
          # An empty discovery would make the loop below vacuously pass.
          if [ -z "$dirs" ]; then
            echo "::error::No modules with tests discovered; refusing to report success."
            exit 1
          fi
          # Every module must have tests, or it is silently skipped.
          for m in modules/*/; do
            printf '%s\n' "$dirs" | grep -qx "${m%/}" || { echo "::error::${m%/} has no tests/*.tftest.hcl"; exit 1; }
          done

          for d in $dirs; do
            echo "::group::$d"
            init_module "$d"
            terraform -chdir="$d" validate
            terraform -chdir="$d" test
            echo "::endgroup::"
          done

  policy:
    needs: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # Checksum comes from the release's own checksums.txt, like the other pinned tools here.
      - name: install conftest
        run: |
          set -euo pipefail
          ver=0.56.0
          asset="conftest_${ver}_Linux_x86_64.tar.gz"
          base="https://github.com/open-policy-agent/conftest/releases/download/v${ver}"
          curl -fsSL -o "$RUNNER_TEMP/$asset" "${base}/${asset}"
          curl -fsSL -o "$RUNNER_TEMP/checksums.txt" "${base}/checksums.txt"
          (cd "$RUNNER_TEMP" && grep " ${asset}$" checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP" conftest
          sudo mv "$RUNNER_TEMP/conftest" /usr/local/bin/conftest
      - name: conftest verify (OPA policy unit tests)
        run: conftest verify -p policies
      # The unit tests above feed hand-written plan fragments. These fixtures are REAL
      # `terraform show -json` output from a live project (identifiers scrubbed), which is what
      # caught a gate bug that every hand-written test missed: a new tenant's bucket, whose KMS key
      # is created in the same plan, has an unknown key at plan time. The clean fixture must pass;
      # each bad one must fail for its EXPECTED reason, so a conftest crash can't pass as "denied".
      - name: real-plan fixtures (clean must pass, bad must fail for the expected reason)
        run: |
          set -euo pipefail
          conftest test --policy policies policies/testdata/clean_new_tenant.json
          expect_fail() {
            local fixture="$1" expected="$2" out rc=0
            out=$(conftest test --policy policies "policies/testdata/$fixture" 2>&1) || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "::error::$fixture should have been DENIED and passed instead"; exit 1
            fi
            if ! printf '%s' "$out" | grep -qF "$expected"; then
              echo "::error::$fixture failed, but not for the expected reason ('$expected'):"; echo "$out"; exit 1
            fi
            echo "$fixture: denied as expected ($expected)"
          }
          expect_fail bad_bucket_without_cmek.json 'encryption.default_kms_key_name is required'
          expect_fail bad_public_bucket.json 'public_access_prevention must be'
          expect_fail bad_primitive_role.json 'primitive role'

  tflint:
    needs: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4
        with:
          tflint_version: v0.63.1
      - run: tflint --recursive

  # Static security scan of the Terraform (public IPs, open firewalls, unencrypted storage...).
  # Pinned release + checksum, no third-party action. The self-test runs FIRST: it scans a
  # deliberately insecure fixture and requires Trivy to report the expected rule, so a green scan
  # of the repo means "clean", not "Trivy is broken or silenced". No ignore file exists today
  # (the modules scan clean). If one is ever added, read it from `main` rather than the PR, or a
  # PR could suppress its own finding.
  trivy:
    needs: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: install trivy
        run: |
          set -euo pipefail
          ver=0.76.1
          sha=c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
          curl -fsSL -o "$RUNNER_TEMP/trivy.tar.gz" "https://github.com/aquasecurity/trivy/releases/download/v${ver}/trivy_${ver}_Linux-64bit.tar.gz"
          echo "${sha}  $RUNNER_TEMP/trivy.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
      - name: self-test (the fixture MUST be flagged)
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/selftest"
          cp .github/trivy/selftest.tf.fixture "$RUNNER_TEMP/selftest/main.tf"
          "$RUNNER_TEMP/trivy" config --skip-version-check --severity HIGH,CRITICAL \
            --format json --output "$RUNNER_TEMP/selftest.json" "$RUNNER_TEMP/selftest"
          ids=$(jq -r '[.Results[]? | (.Misconfigurations // [])[] | .ID] | unique | .[]' "$RUNNER_TEMP/selftest.json")
          echo "self-test reported: ${ids:-<none>}"
          if ! printf '%s\n' "$ids" | grep -qxE '(AVD-)?GCP-0017'; then
            echo "::error::Trivy did not flag the self-test fixture (expected GCP-0017). The scan below can no longer be trusted."
            exit 1
          fi
      - name: scan (HIGH/CRITICAL fail the build)
        run: |
          "$RUNNER_TEMP/trivy" config --skip-version-check --severity HIGH,CRITICAL --exit-code 1 .

  # The single required check. Branch protection should require ONLY this job: it fails if any
  # job above failed, was cancelled or was skipped. `if: always()` is load-bearing — without it a
  # failed upstream job would make this one skip, and a skipped required check can read as passed.
  # Requiring the individual jobs instead means a renamed or removed job silently drops out of
  # "required". Add every new job to `needs` below.
  ci-success:
    needs: [gitleaks, actionlint, fmt, test, policy, tflint, trivy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' >/dev/null; then
            echo "all required jobs succeeded"
          else
            echo "::error::one or more required jobs did not succeed"
            exit 1
          fi

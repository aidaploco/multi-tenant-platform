name: ci

# Pre-merge code checks — no cloud credentials needed, so this runs on every PR (unlike the
# credential-gated CD). The "pytest + pylint" for our Terraform: format, validate, the mocked
# `terraform test` suites, the OPA policy unit tests, and tflint.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# One run per PR at a time: a new push cancels the superseded run instead of burning minutes on
# it. Pushes to main are never cancelled, so every merge keeps its own complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Secret scan over the full git history, before anything else runs. Pinned release + checksum
  # (no third-party action). Fails the build on any finding; findings are redacted in the log.
  #
  # The config (.gitleaks.toml) and fingerprint ignores (.gitleaksignore) are taken from `main`,
  # NOT from the PR: gitleaks reads both from the scanned tree, so otherwise a PR could allowlist
  # its own leak in the same commit that introduces it. If main has neither file, the scan runs
  # with the built-in rules only (stricter, never looser) — it never falls back to the PR's copy.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: checkout the trusted gitleaks config from main
        uses: actions/checkout@v5
        with:
          ref: main
          path: trusted-main
          persist-credentials: false
      - name: replace the PR's gitleaks config with main's
        run: |
          set -euo pipefail
          for f in .gitleaks.toml .gitleaksignore; do
            rm -f "$f"
            if [ -f "trusted-main/$f" ]; then cp "trusted-main/$f" "$f"; fi
          done
          rm -rf trusted-main
      - name: gitleaks (full history)
        run: |
          set -euo pipefail
          ver=8.30.1
          sha=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz"
          echo "${sha}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --log-opts="--all" .

  # A workflow that fails to PARSE produces a run with no jobs, hence no check runs: its required
  # checks are absent rather than red, and a PR can read as green while CI is dead. actionlint
  # fails loudly on that (and on bad expressions and shell). SC2016 is ignored: it flags the
  # intentional single-quoted backticks in the VERSIONS.md grep.
  actionlint:
    needs: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: actionlint
        run: |
          set -euo pipefail
          ver=1.7.12
          sha=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v${ver}/actionlint_${ver}_linux_amd64.tar.gz"
          echo "${sha}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color -ignore 'SC2016'

  fmt:
    needs: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive

  test:
    needs: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - name: validate + test every module
        run: |
          set -euo pipefail
          for d in $(find modules -name '*.tftest.hcl' | sed -E 's#/tests/.*##' | sort -u); do
            echo "::group::$d"
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
            terraform -chdir="$d" test
            echo "::endgroup::"
          done

  policy:
    needs: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: conftest verify (OPA policy unit tests)
        run: |
          ver=0.56.0
          curl -fsSL "https://github.com/open-policy-agent/conftest/releases/download/v${ver}/conftest_${ver}_Linux_x86_64.tar.gz" | tar -xz conftest
          sudo mv conftest /usr/local/bin/conftest
          conftest verify -p policies

  tflint:
    needs: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --recursive

  # Static security scan of the Terraform (public IPs, open firewalls, unencrypted storage...).
  # Pinned release + checksum, no third-party action. The self-test runs FIRST: it scans a
  # deliberately insecure fixture and requires Trivy to report the expected rule, so a green scan
  # of modules/ means "clean", not "Trivy is broken or silenced". No ignore file exists today
  # (the modules scan clean). If one is ever added, read it from `main` rather than the PR, or a
  # PR could suppress its own finding.
  trivy:
    needs: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: install trivy
        run: |
          set -euo pipefail
          ver=0.76.1
          sha=c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
          curl -fsSL -o "$RUNNER_TEMP/trivy.tar.gz" "https://github.com/aquasecurity/trivy/releases/download/v${ver}/trivy_${ver}_Linux-64bit.tar.gz"
          echo "${sha}  $RUNNER_TEMP/trivy.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
      - name: self-test (the fixture MUST be flagged)
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/selftest"
          cp .github/trivy/selftest.tf.fixture "$RUNNER_TEMP/selftest/main.tf"
          "$RUNNER_TEMP/trivy" config --skip-version-check --severity HIGH,CRITICAL \
            --format json --output "$RUNNER_TEMP/selftest.json" "$RUNNER_TEMP/selftest"
          ids=$(jq -r '[.Results[]? | (.Misconfigurations // [])[] | .ID] | unique | .[]' "$RUNNER_TEMP/selftest.json")
          echo "self-test reported: ${ids:-<none>}"
          if ! printf '%s\n' "$ids" | grep -qxE '(AVD-)?GCP-0017'; then
            echo "::error::Trivy did not flag the self-test fixture (expected GCP-0017). The scan below can no longer be trusted."
            exit 1
          fi
      - name: scan (HIGH/CRITICAL fail the build)
        run: |
          "$RUNNER_TEMP/trivy" config --skip-version-check --severity HIGH,CRITICAL --exit-code 1 .

  # The single required check. Branch protection should require ONLY this job: it fails if any
  # job above failed, was cancelled or was skipped. `if: always()` is load-bearing — without it a
  # failed upstream job would make this one skip, and a skipped required check can read as passed.
  # Requiring the individual jobs instead means a renamed or removed job silently drops out of
  # "required". Add every new job to `needs` below.
  ci-success:
    needs: [gitleaks, actionlint, fmt, test, policy, tflint, trivy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' >/dev/null; then
            echo "all required jobs succeeded"
          else
            echo "::error::one or more required jobs did not succeed"
            exit 1
          fi
